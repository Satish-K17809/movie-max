<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Max - Registration</title>

<!-- Fonts: Fraunces for the logo/headings, Inter for body text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F3;      /* off-white base */
        color: #2A2924;

        /* Background image served by Flask from the static folder */
        background-image: url('/static/image.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;   /* keeps the image locked in place while the page scrolls */

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Header: film reel icon + site name, same as home page */
    .site-header { display: flex; flex-direction: column; align-items: center; padding: 56px 20px 20px; }
    .reel-mark { width: 34px; height: 34px; margin-bottom: 12px; }
    .site-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; letter-spacing: 0.5px; color: #2A2924; }
    .site-name span { color: #9A9890; font-weight: 500; }

    /* Card holding the registration form */
    .reg-wrap { display: flex; justify-content: center; padding: 20px 20px 80px; width: 100%; }

    .reg-card {
        background: #FFFFFF;
        border: 1px solid #DEDCD5;
        border-radius: 6px;
        padding: 40px 46px;
        max-width: 440px;
        width: 100%;
    }

    .reg-card h1 {
        font-family: 'Fraunces', serif;
        font-size: 21px;
        font-weight: 600;
        margin: 0 0 26px;
        text-align: center;
        color: #2A2924;
    }

    label { display: block; font-size: 12.5px; color: #6F6D66; margin-bottom: 6px; margin-top: 16px; }
    label:first-of-type { margin-top: 0; }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #DEDCD5;
        border-radius: 4px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        background: #F7F6F3;
        color: #2A2924;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="password"]:focus { outline: none; border-color: #2A2924; }

    .email-row { display: flex; align-items: center; }
    .radio-row { display: flex; gap: 30px; margin-top: 10px; }
    .genre-row { display: grid; grid-template-columns: 1fr 1fr; row-gap: 14px; column-gap: 20px; margin-top: 10px; }

    .inline-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #444341; cursor: pointer; }

    /* Custom checkbox/radio: turns off the browser's native control
       so every box/circle renders at the exact same size, regardless
       of operating system or browser. */
    .inline-row input[type="checkbox"],
    .inline-row input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        margin: 0;
        border: 1.5px solid #C9C7C0;
        background: #FFFFFF;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
    }

    .inline-row input[type="checkbox"] { border-radius: 4px; }
    .inline-row input[type="radio"] { border-radius: 50%; }

    .inline-row input[type="checkbox"]:checked,
    .inline-row input[type="radio"]:checked { background: #2A2924; border-color: #2A2924; }

    /* Checkmark drawn with CSS for checkboxes */
    .inline-row input[type="checkbox"]:checked::after {
        content: '';
        position: absolute;
        left: 5px;
        top: 1px;
        width: 4px;
        height: 9px;
        border: solid #FFFFFF;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    /* Filled dot drawn with CSS for radios */
    .inline-row input[type="radio"]:checked::after {
        content: '';
        position: absolute;
        top: 4.5px;
        left: 4.5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #FFFFFF;
    }

    .reg-submit {
        width: 100%;
        margin-top: 26px;
        padding: 12px 0;
        font-family: 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        background: #2A2924;
        color: #F7F6F3;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s ease;
    }
    .reg-submit:hover { background: #454339; }

    /* Simple error message box, shown only when Flask passes an error,
       or when the genre check below catches a missing selection */
    .error-box {
        background: #FBEAEA;
        border: 1px solid #E3B8B8;
        color: #9A3B3B;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
        text-align: center;
    }
</style>
</head>

<body>

    <div class="site-header">
        <svg class="reel-mark" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="6" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="9" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="17" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="24" cy="39" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="17" r="2.6" fill="#2A2924"/>
        </svg>
        <div class="site-name">MOVIE <span>MAX</span></div>
    </div>

    <div class="reg-wrap">
        <div class="reg-card">
            <h1>New User Registration</h1>

            <!-- This box only shows up if app.py passes an "error" message -->
            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <p style="font-size:13px; color:#6F6D66; margin-bottom:18px; text-align:center;">
                Note: your email address will be your username to login.
            </p>

            <form action="/register" method="POST">

                <label>Name:</label>
                <input type="text" name="name" id="name" value="{{ old.name if old else '' }}"
                       pattern="[A-Za-z ]{2,40}"
                       title="Name should only contain letters and spaces (2-40 characters)"
                       required>

                <label>Email:</label>
                <div class="email-row">
                    <!-- Gmail rule: lowercase letters/digits, starts with a letter, ends with @gmail.com
                         (app.py checks the same rule again on the server) -->
                    <input type="text" name="email" id="email" value="{{ old.email if old else '' }}"
                           placeholder="example@gmail.com"
                           pattern="[a-z][a-z0-9]*@gmail\.com"
                           title="Please enter a valid lowercase Gmail address." required>
                </div>

                <label>Phone Number:</label>
                <input type="tel" name="phone" id="phone" value="{{ old.phone if old else '' }}" placeholder="10-digit number" pattern="[0-9]{10}" title="Phone number must be exactly 10 digits" required>

                <label>Gender:</label>
                <div class="radio-row">
                    <label class="inline-row"><input type="radio" name="gender" value="Male" required {{ 'checked' if old and old.gender == 'Male' else '' }}> Male</label>
                    <label class="inline-row"><input type="radio" name="gender" value="Female" required {{ 'checked' if old and old.gender == 'Female' else '' }}> Female</label>
                </div>

                <label>Select your favourite genre:</label>
                <div class="genre-row" id="genreRow">
                    <label class="inline-row"><input type="checkbox" name="genre" value="Action" {{ 'checked' if old and 'Action' in old.genre else '' }}> Action</label>
                    <label class="inline-row"><input type="checkbox" name="genre" value="Comedy" {{ 'checked' if old and 'Comedy' in old.genre else '' }}> Comedy</label>
                    <label class="inline-row"><input type="checkbox" name="genre" value="Drama" {{ 'checked' if old and 'Drama' in old.genre else '' }}> Drama</label>
                    <label class="inline-row"><input type="checkbox" name="genre" value="Horror" {{ 'checked' if old and 'Horror' in old.genre else '' }}> Horror</label>
                    <label class="inline-row"><input type="checkbox" name="genre" value="Sci-Fi" {{ 'checked' if old and 'Sci-Fi' in old.genre else '' }}> Sci-Fi</label>
                    <label class="inline-row"><input type="checkbox" name="genre" value="Thriller" {{ 'checked' if old and 'Thriller' in old.genre else '' }}> Thriller</label>
                </div>
                <!-- JS below checks that at least one genre is ticked, since
                     plain HTML "required" doesn't work across a group of checkboxes -->
                <div id="genreError" class="error-box" style="display:none;">Please select at least one genre.</div>

                <label>Create Password:</label>
                <input type="password" name="password" id="password" minlength="6"
                       title="Password must be at least 6 characters" required>

                <button type="submit" class="reg-submit">Register</button>

            </form>
        </div>
    </div>

    <script>
        // Extra validation for the genre checkboxes - HTML5's "required"
        // attribute can't check "at least one box in a group is ticked",
        // so we check it ourselves right before the form submits.
        document.querySelector('form').addEventListener('submit', function (e) {
            const genreChecked = document.querySelectorAll('#genreRow input[type="checkbox"]:checked');
            const genreError = document.getElementById('genreError');

            if (genreChecked.length === 0) {
                e.preventDefault();          // stop the form from submitting
                genreError.style.display = 'block';
            } else {
                genreError.style.display = 'none';
            }
        });
    </script>

</body>
</html>
