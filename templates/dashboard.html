<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movie Max - Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F3;
        color: #2A2924;

        background-image: url('/static/image.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .site-header { display: flex; flex-direction: column; align-items: center; padding: 56px 20px 20px; }
    .reel-mark { width: 34px; height: 34px; margin-bottom: 12px; }
    .site-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; letter-spacing: 0.5px; color: #2A2924; }
    .site-name span { color: #9A9890; font-weight: 500; }

    .dash-wrap { display: flex; justify-content: center; padding: 20px 20px 80px; width: 100%; }

    .dash-card {
        background: #FFFFFF;
        border: 1px solid #DEDCD5;
        border-radius: 6px;
        padding: 40px 46px;
        max-width: 440px;
        width: 100%;
    }

    .dash-card h1 {
        font-family: 'Fraunces', serif;
        font-size: 21px;
        font-weight: 600;
        margin: 0 0 26px;
        text-align: center;
        color: #2A2924;
    }

    /* Each row shows one detail: label on top, value below */
    .detail-row { padding: 14px 0; border-bottom: 1px solid #EFEDE8; }
    .detail-row:last-of-type { border-bottom: none; }
    .detail-label { font-size: 12px; color: #9A9890; margin-bottom: 4px; }
    .detail-value { font-size: 15px; color: #2A2924; }

    .logout-btn {
        display: block;
        width: 100%;
        text-align: center;
        margin-top: 26px;
        padding: 12px 0;
        font-family: 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        background: transparent;
        color: #2A2924;
        border: 1px solid #DEDCD5;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s ease;
    }
    .logout-btn:hover { border-color: #2A2924; }
</style>
</head>

<body>

    <div class="site-header">
        <svg class="reel-mark" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="6" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="9" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="17" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="24" cy="39" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="17" r="2.6" fill="#2A2924"/>
        </svg>
        <div class="site-name">MOVIE <span>MAX</span></div>
    </div>

    <div class="dash-wrap">
        <div class="dash-card">
            <h1>My Account</h1>

            <!-- user is a MongoDB document (a dictionary), so we use user.name, user.email, etc. -->

            <div class="detail-row">
                <div class="detail-label">Name</div>
                <div class="detail-value">{{ user.name }}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Email</div>
                <div class="detail-value">{{ user.email }}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Phone Number</div>
                <div class="detail-value">{{ user.phone }}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Gender</div>
                <div class="detail-value">{{ user.gender }}</div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Favourite Genres</div>
                <div class="detail-value">{{ user.genres }}</div>
            </div>

            <a href="{{ url_for('home') }}" class="logout-btn">Back to Home</a>
            <a href="{{ url_for('logout') }}" class="logout-btn" style="margin-top:12px;">Logout</a>
        </div>
    </div>

</body>
</html>
