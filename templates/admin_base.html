<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %} - Movie Max</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F3;
        color: #2A2924;
        background-image: url('/static/image.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    a { color: inherit; text-decoration: none; }

    /* ---------- Header ---------- */
    .adm-top { background: #FFFFFF; border-bottom: 1px solid #DEDCD5; position: sticky; top: 0; z-index: 20; }
    .adm-inner { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; letter-spacing: 0.5px; }
    .brand em { font-style: normal; color: #9A9890; font-weight: 500; }
    .reel-mark { width: 28px; height: 28px; }
    .adm-tag { font-size: 11px; letter-spacing: 1.5px; background: #2A2924; color: #F7F6F3; padding: 3px 9px; border-radius: 3px; }

    .adm-nav { display: flex; gap: 8px; margin-left: 10px; }
    .adm-nav a { padding: 8px 16px; font-size: 14px; font-weight: 500; color: #6F6D66; border-radius: 4px; border: 1px solid transparent; }
    .adm-nav a:hover { color: #2A2924; }
    .adm-nav a.active { background: #2A2924; color: #F7F6F3; }

    .btn-outline { margin-left: auto; padding: 9px 20px; font-size: 14px; font-weight: 600; border: 1px solid #DEDCD5; border-radius: 4px; }
    .btn-outline:hover { border-color: #2A2924; }

    /* ---------- Page ---------- */
    .adm-container { max-width: 1180px; margin: 0 auto; padding: 36px 20px 80px; }
    .adm-card { background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 6px; padding: 34px 38px; }
    h1.page-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; margin: 0 0 6px; }
    p.page-sub { font-size: 14px; color: #6F6D66; margin: 0 0 24px; }

    .error-box, .success-box { font-size: 13.5px; padding: 10px 14px; border-radius: 4px; margin-bottom: 18px; text-align: center; }
    .error-box { background: #FBEAEA; border: 1px solid #E3B8B8; color: #9A3B3B; }
    .success-box { background: #EAF5EA; border: 1px solid #B9D9B9; color: #2E7D32; }

    /* ---------- Add-movie form ---------- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12.5px; color: #6F6D66; margin-bottom: 6px; margin-top: 16px; }
    .hint { font-size: 11.5px; color: #9A9890; margin-top: 4px; }

    input[type="text"], input[type="number"], textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #DEDCD5;
        border-radius: 4px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        background: #F7F6F3;
        color: #2A2924;
    }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: #2A2924; }

    .submit-btn {
        margin-top: 28px;
        width: 100%;
        padding: 13px 0;
        font-family: 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        background: #2A2924;
        color: #F7F6F3;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .submit-btn:hover { background: #454339; }

    /* ---------- Bookings table ---------- */
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat { flex: 1; min-width: 150px; background: #F7F6F3; border: 1px solid #EFEDE8; border-radius: 4px; padding: 14px 18px; }
    .stat small { display: block; font-size: 12px; color: #9A9890; margin-bottom: 4px; }
    .stat strong { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; }

    .search-box { margin-bottom: 16px; max-width: 360px; }
    .search-box input { margin: 0; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 920px; }
    th { text-align: left; font-size: 12px; font-weight: 600; color: #6F6D66; padding: 10px 12px; border-bottom: 2px solid #DEDCD5; white-space: nowrap; }
    td { padding: 12px; border-bottom: 1px solid #EFEDE8; vertical-align: top; }
    td small { display: block; color: #9A9890; font-size: 12px; }
    .id-cell { font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
    .badge { display: inline-block; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #EAF5EA; color: #2E7D32; border-radius: 3px; }
    .empty-row { text-align: center; color: #6F6D66; padding: 30px; }

    @media (max-width: 680px) {
        .form-grid { grid-template-columns: 1fr; }
        .adm-card { padding: 24px 18px; }
        .btn-outline { margin-left: 0; }
    }
</style>
</head>

<body>

    <header class="adm-top">
        <div class="adm-inner">
            <a class="brand" href="{{ url_for('admin_home') }}">
                <svg class="reel-mark" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="21" stroke="#2A2924" stroke-width="1.6"/>
                    <circle cx="24" cy="24" r="6" stroke="#2A2924" stroke-width="1.6"/>
                    <circle cx="24" cy="9" r="2.6" fill="#2A2924"/>
                    <circle cx="37" cy="17" r="2.6" fill="#2A2924"/>
                    <circle cx="37" cy="31" r="2.6" fill="#2A2924"/>
                    <circle cx="24" cy="39" r="2.6" fill="#2A2924"/>
                    <circle cx="11" cy="31" r="2.6" fill="#2A2924"/>
                    <circle cx="11" cy="17" r="2.6" fill="#2A2924"/>
                </svg>
                <span>MOVIE <em>MAX</em></span>
            </a>
            <span class="adm-tag">ADMIN</span>

            <nav class="adm-nav">
                <a href="{{ url_for('admin_add_movie') }}" class="{{ 'active' if active == 'add' else '' }}">Add Movie</a>
                <a href="{{ url_for('admin_bookings') }}" class="{{ 'active' if active == 'bookings' else '' }}">Booked Details</a>
            </nav>

            <a class="btn-outline" href="{{ url_for('logout') }}">Logout</a>
        </div>
    </header>

    <main class="adm-container">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
