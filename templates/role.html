<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Max - Welcome</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #F7F6F3;
        color: #2A2924;
        background-image: url('/static/image.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .site-header { display: flex; flex-direction: column; align-items: center; padding: 56px 20px 20px; }
    .reel-mark { width: 34px; height: 34px; margin-bottom: 12px; }
    .site-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; letter-spacing: 0.5px; color: #2A2924; }
    .site-name span { color: #9A9890; font-weight: 500; }

    .home-wrap { display: flex; justify-content: center; padding: 30px 20px 80px; width: 100%; }

    .card {
        background: #FFFFFF;
        border: 1px solid #DEDCD5;
        border-radius: 6px;
        padding: 46px 52px;
        max-width: 400px;
        width: 100%;
        text-align: center;
    }

    .eyebrow { font-size: 12px; color: #9A9890; margin-bottom: 10px; }
    h1.title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 0 0 8px; color: #2A2924; }
    p.sub { font-size: 14.5px; color: #6F6D66; margin: 0 0 30px; line-height: 1.5; }

    .btn {
        display: block;
        width: 100%;
        padding: 13px 0;
        font-family: 'Inter', sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s ease;
        border: 1px solid transparent;
    }
    .btn-primary { background: #2A2924; color: #F7F6F3; margin-bottom: 12px; }
    .btn-primary:hover { background: #454339; }
    .btn-secondary { background: transparent; color: #2A2924; border: 1px solid #DEDCD5; }
    .btn-secondary:hover { border-color: #2A2924; }
</style>
</head>

<body>

    <div class="site-header">
        <svg class="reel-mark" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="21" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="24" r="6" stroke="#2A2924" stroke-width="1.6"/>
            <circle cx="24" cy="9" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="17" r="2.6" fill="#2A2924"/>
            <circle cx="37" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="24" cy="39" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="31" r="2.6" fill="#2A2924"/>
            <circle cx="11" cy="17" r="2.6" fill="#2A2924"/>
        </svg>
        <div class="site-name">MOVIE <span>MAX</span></div>
    </div>

    <div class="home-wrap">
        <div class="card">
            <div class="eyebrow">Welcome</div>
            <h1 class="title">Movie Ticket Booking</h1>
            <p class="sub">How would you like to continue?</p>

            <a class="btn btn-primary" href="{{ url_for('user_welcome') }}">Continue as User</a>
            <a class="btn btn-secondary" href="{{ url_for('admin_login') }}">Login as Admin</a>
        </div>
    </div>

</body>
</html>
